<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="프로젝트 성과와 기술 역량을 명확하게 보여주는 개발자 포트폴리오입니다."
    />
    <title>임보연 | 개발자 포트폴리오</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-orb orb-one" aria-hidden="true"></div>
    <div class="background-orb orb-two" aria-hidden="true"></div>

    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="#home">BOYEON DEV</a>
        <button
          class="nav-toggle"
          id="nav-toggle"
          type="button"
          aria-controls="site-nav"
          aria-expanded="false"
        >
          메뉴
        </button>
        <nav class="site-nav" id="site-nav" aria-label="주요 메뉴">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#projects">Projects</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section hero reveal" id="home">
        <div class="container hero-content">
          <p class="eyebrow">Frontend Developer</p>
          <h1 id="profile-name"></h1>
          <p class="hero-tagline" id="profile-tagline"></p>
          <p class="hero-description" id="profile-description"></p>
          <div class="hero-actions">
            <a class="button" href="#projects">프로젝트 보기</a>
            <a class="button button-secondary" id="hero-mail-link" href="#">
              메일로 연락하기
            </a>
          </div>
        </div>
      </section>

      <section class="section reveal" id="about">
        <div class="container">
          <h2>소개</h2>
          <p class="section-intro" id="about-description"></p>
          <h3>기술 스택</h3>
          <ul class="chip-list" id="tech-stack-list" aria-label="기술 스택"></ul>
        </div>
      </section>

      <section class="section reveal" id="projects">
        <div class="container">
          <h2>프로젝트</h2>
          <p class="section-intro">
            문제를 정의하고 사용자 가치를 구현한 주요 프로젝트입니다.
          </p>
          <div class="project-grid" id="project-grid"></div>
        </div>
      </section>

      <section class="section reveal" id="contact">
        <div class="container">
          <h2>연락처</h2>
          <p class="section-intro">
            협업 제안이나 채용 문의는 아래 채널로 편하게 연락해주세요.
          </p>
          <div class="contact-actions">
            <a class="button" id="email-link" href="#">이메일 보내기</a>
            <a
              class="button button-secondary"
              id="github-link"
              href="#"
              target="_blank"
              rel="noreferrer"
            >
              GitHub 보기
            </a>
          </div>
          <div class="inline-links" id="etc-links" aria-label="추가 링크"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>
          &copy; <span id="current-year"></span> <span id="footer-name"></span>.
          All rights reserved.
        </small>
      </div>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
